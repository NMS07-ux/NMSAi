<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMS AI — Chat</title>

  <!-- Markdown + LaTeX -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #070a12;
      --panel: rgba(13, 18, 31, .88);
      --panel2: rgba(18, 24, 40, .92);
      --line: rgba(255,255,255,.09);
      --text: #f5f7ff;
      --muted: #8d96ab;
      --accent: #7c5cff;
      --accent2: #00d9ff;
      --danger: #ff5577;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(124,92,255,.16), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0,217,255,.10), transparent 28%),
        var(--bg);
      overflow: hidden;
    }

    button, textarea { font: inherit; }

    .app {
      height: 100vh;
      display: flex;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 285px;
      min-width: 285px;
      height: 100vh;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      background: rgba(8, 12, 22, .94);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(22px);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 5px 8px 18px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 0 28px rgba(124,92,255,.34);
    }

    .brand-text strong { display: block; font-size: 16px; }
    .brand-text span { color: var(--muted); font-size: 11px; }

    .new-chat {
      width: 100%;
      border: 1px solid rgba(124,92,255,.45);
      border-radius: 13px;
      padding: 12px 14px;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(124,92,255,.20), rgba(0,217,255,.08));
      transition: .22s ease;
      text-align: left;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      border-color: rgba(0,217,255,.75);
      box-shadow: 0 0 24px rgba(0,217,255,.13);
    }

    .chat-history {
      margin-top: 20px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .history-title {
      padding: 0 9px 10px;
      color: #68738b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px 7px 9px;
    }

    .history-head .history-title {
      padding: 0;
    }

    .history-search-toggle {
      width: 28px;
      height: 28px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #7e899f;
      cursor: pointer;
      font-size: 18px;
      transition: .2s ease;
    }

    .history-search-toggle:hover {
      color: white;
      border-color: var(--line);
      background: rgba(255,255,255,.05);
    }

    .history-search-wrap {
      display: none;
      margin: 0 5px 8px;
    }

    .history-search-wrap.open {
      display: block;
    }

    #historySearch {
      width: 100%;
      height: 35px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: rgba(255,255,255,.045);
      color: white;
      font-size: 12px;
    }

    #historySearch::placeholder {
      color: #687287;
    }

    #historySearch:focus {
      border-color: rgba(124,92,255,.55);
      box-shadow: 0 0 18px rgba(124,92,255,.10);
    }

    .history-list {
      overflow-y: auto;
      padding-right: 3px;
    }

    .history-list::-webkit-scrollbar,
    #messages::-webkit-scrollbar { width: 5px; }

    .history-list::-webkit-scrollbar-thumb,
    #messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 20px;
    }

    .history-item {
      min-height: 43px;
      margin: 3px 0;
      padding: 8px 8px 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #b8c0d2;
      cursor: pointer;
      transition: .18s ease;
    }

    .history-item:hover {
      background: rgba(255,255,255,.045);
      color: white;
    }

    .history-item.active {
      background: linear-gradient(90deg, rgba(124,92,255,.16), rgba(0,217,255,.05));
      border-color: rgba(124,92,255,.25);
      color: white;
    }

    .history-chat-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .history-delete {
      border: 0;
      background: transparent;
      color: #69748a;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .history-delete:hover {
      color: var(--danger);
      background: rgba(255,85,119,.10);
    }

    .history-rename {
      border: 0;
      background: transparent;
      color: #69748a;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      opacity: 0;
      transition: .18s ease;
    }

    .history-item:hover .history-rename {
      opacity: 1;
    }

    .history-rename:hover {
      color: #75ddff;
      background: rgba(0,217,255,.09);
    }

    .history-date {
      display: block;
      color: #5f687c;
      font-size: 9px;
      margin-top: 2px;
    }

    .history-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .history-empty {
      padding: 18px 10px;
      color: #5f687c;
      font-size: 12px;
      text-align: center;
    }

    .sidebar-footer {
      color: #596276;
      font-size: 11px;
      padding: 12px 8px 2px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ---------- MAIN ---------- */
    .main {
      min-width: 0;
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,10,18,.62);
      backdrop-filter: blur(18px);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aab2c2;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35e6a1;
      box-shadow: 0 0 12px #35e6a1;
    }

    .model-pill {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: #9da6b9;
      font-size: 11px;
      background: rgba(255,255,255,.025);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px max(5vw, 22px) 145px;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:
        0 0 45px rgba(124,92,255,.27),
        inset 0 0 20px rgba(255,255,255,.12);
      margin-bottom: 18px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: -1.5px;
    }

    .welcome p {
      margin: 10px 0 0;
      max-width: 520px;
      color: var(--muted);
      line-height: 1.6;
    }

    .message {
      max-width: 900px;
      margin: 0 auto 18px;
    }

    .user-message,
    .ai-message {
      max-width: 900px;
      margin: 0 auto 18px;
      display: flex;
    }

    .user-message { justify-content: flex-end; }

    .message-content {
      max-width: min(78%, 760px);
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.65;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .user-message .message-content {
      background: linear-gradient(135deg, #6749e9, #5540b8);
      border: 1px solid rgba(255,255,255,.10);
      border-bottom-right-radius: 5px;
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
    }

    .ai-message .message-content {
      background: rgba(20,26,43,.70);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
    }

    .message-content p:first-child { margin-top: 0; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content pre {
      overflow-x: auto;
      padding: 12px;
      border-radius: 10px;
      background: #090d17;
      border: 1px solid var(--line);
    }
    .message-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .message-content :not(pre) > code {
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(255,255,255,.07);
    }
    .message-content a { color: #75ddff; }

    /* ---------- COMPOSER ---------- */
    .composer-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px max(5vw, 22px) 22px;
      background: linear-gradient(transparent, rgba(7,10,18,.94) 28%);
    }

    .composer {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 9px 9px 9px 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(16,21,36,.92);
      box-shadow: 0 18px 55px rgba(0,0,0,.38), 0 0 35px rgba(124,92,255,.06);
      backdrop-filter: blur(18px);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      min-height: 42px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 10px 4px;
      line-height: 1.45;
    }

    #messageInput::placeholder { color: #687287; }

    .send {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 0;
      border-radius: 13px;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 24px rgba(124,92,255,.28);
      transition: .2s ease;
    }

    .send:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 30px rgba(0,217,255,.28);
    }

    .hint {
      max-width: 900px;
      margin: 7px auto 0;
      text-align: center;
      color: #525c70;
      font-size: 10px;
    }

    .dots {
      display: inline-block;
      width: 22px;
      overflow: hidden;
      vertical-align: bottom;
      animation: dots 1.2s steps(4,end) infinite;
    }

    @keyframes dots {
      0% { width: 0; }
      100% { width: 22px; }
    }

    @media (max-width: 760px) {
      .sidebar {
        width: 220px;
        min-width: 220px;
      }
      .message-content { max-width: 88%; }
      #messages { padding-left: 14px; padding-right: 14px; }
      .composer-wrap { padding-left: 12px; padding-right: 12px; }
    }

    @media (max-width: 560px) {
      .sidebar { width: 185px; min-width: 185px; padding: 12px 9px; }
      .brand-text { display: none; }
      .topbar { padding: 0 13px; }
      .model-pill { display: none; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div class="brand-text">
          <strong>NMS AI</strong>
          <span>Intelligent workspace</span>
        </div>
      </div>

      <button class="new-chat" type="button">＋&nbsp; New chat</button>

      <!-- JavaScript automatically fills this section with saved chats -->
      <div class="chat-history">
        <div class="history-head">
          <div class="history-title">CHAT HISTORY</div>
          <button class="history-search-toggle" type="button" title="Search chats">⌕</button>
        </div>
        <div class="history-search-wrap">
          <input id="historySearch" type="search" placeholder="Search chats..." autocomplete="off">
        </div>
        <div class="history-list"></div>
      </div>

      <div class="sidebar-footer">
        <span id="userNameDisplay" style="color: #9da6b9; font-weight: bold;">User</span>
        <button id="logoutBtn" type="button" style="background: transparent; border: 1px solid var(--line); color: var(--danger); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="status">
          <span class="status-dot"></span>
          <span>NMS AI is ready</span>
        </div>
        <div class="model-pill">NMS AI • Chat</div>
      </header>

      <section id="messages">
        <div class="welcome">
          <div class="welcome-icon">N</div>
          <h1>What can I help with?</h1>
          <p>Ask a question, write code, solve a problem, or start building something new.</p>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="messageInput" rows="1" placeholder="Message NMS AI..." aria-label="Message NMS AI"></textarea>
          <button class="send" type="button" aria-label="Send message">➤</button>
        </div>
        <div class="hint">Enter to send • Shift + Enter for a new line</div>
      </div>
    </main>
  </div>

  <script>
    // 1. ROUTE GUARD: Check authentication status
    const loggedInUserRaw = localStorage.getItem("nms_ai_logged_in_user");
    if (!loggedInUserRaw) {
      window.location.href = "index.html";
    }
    const currentUser = JSON.parse(loggedInUserRaw);

    // 2. DOM ELEMENTS
    const input = document.getElementById("messageInput");
    const sendButton = document.querySelector(".send");
    const messages = document.getElementById("messages");
    const welcome = document.querySelector(".welcome");
    const newChatButton = document.querySelector(".new-chat");

    // 3. ISOLATED USER STORAGE
    const HISTORY_KEY = `nms_ai_chats_${currentUser.id}`;
    let currentChatId = null;
    let chats = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");

    // 4. LOGOUT & USER DISPLAY BINDING
    window.addEventListener("DOMContentLoaded", () => {
      const nameDisplay = document.getElementById("userNameDisplay");
      if (nameDisplay && currentUser.name) {
        nameDisplay.textContent = currentUser.name;
      }

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("nms_ai_logged_in_user");
          window.location.href = "index.html";
        });
      }
    });

    function saveChats() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(chats));
    }

    function getCurrentChat() {
      return chats.find(chat => chat.id === currentChatId);
    }

    function generateChatTitle(text) {
      let title = text.trim()
        .replace(/[#*_`]/g, "")
        .replace(/\s+/g, " ");
      return title.length > 35 ? title.substring(0, 35).trim() + "..." : (title || "New Chat");
    }

    function formatChatDate(timestamp) {
      if (!timestamp) return "";
      const date = new Date(timestamp);
      const now = new Date();
      const sameDay =
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate();

      if (sameDay) {
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      return date.toLocaleDateString([], {
        day: "2-digit",
        month: "short"
      });
    }

    function renderHistory() {
      const historyList = document.querySelector(".history-list");
      const query = (document.getElementById("historySearch")?.value || "").trim().toLowerCase();
      historyList.innerHTML = "";

      chats.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));

      const filtered = chats.filter(chat =>
        !query || (chat.title || "New Chat").toLowerCase().includes(query)
      );

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = query ? "No matching chats" : "No previous chats";
        historyList.appendChild(empty);
        return;
      }

      filtered.forEach(chat => {
        const item = document.createElement("div");
        item.className = "history-item" + (chat.id === currentChatId ? " active" : "");

        const titleWrap = document.createElement("div");
        titleWrap.className = "history-title-wrap";

        const title = document.createElement("span");
        title.className = "history-chat-title";
        title.textContent = chat.title || "New Chat";
        title.title = chat.title || "New Chat";

        const date = document.createElement("span");
        date.className = "history-date";
        date.textContent = formatChatDate(chat.updatedAt || chat.createdAt);

        titleWrap.appendChild(title);
        titleWrap.appendChild(date);

        const renameButton = document.createElement("button");
        renameButton.className = "history-rename";
        renameButton.type = "button";
        renameButton.textContent = "✎";
        renameButton.title = "Rename chat";
        renameButton.setAttribute("aria-label", "Rename chat");

        const deleteButton = document.createElement("button");
        deleteButton.className = "history-delete";
        deleteButton.type = "button";
        deleteButton.textContent = "⋮";
        deleteButton.title = "Delete chat";
        deleteButton.setAttribute("aria-label", "Delete chat");

        item.addEventListener("click", () => loadChat(chat.id));

        renameButton.addEventListener("click", event => {
          event.stopPropagation();
          renameChat(chat.id);
        });

        deleteButton.addEventListener("click", event => {
          event.stopPropagation();
          deleteChat(chat.id);
        });

        item.appendChild(titleWrap);
        item.appendChild(renameButton);
        item.appendChild(deleteButton);
        historyList.appendChild(item);
      });
    }

    function renameChat(chatId) {
      const chat = chats.find(item => item.id === chatId);
      if (!chat) return;

      const newTitle = prompt("Rename this chat:", chat.title || "New Chat");
      if (newTitle === null) return;

      const title = newTitle.trim();
      if (!title) return;

      chat.title = title.substring(0, 60);
      chat.updatedAt = Date.now();
      saveChats();
      renderHistory();
    }

    function createNewChat() {
      currentChatId = Date.now().toString();

      chats.unshift({
        id: currentChatId,
        title: "New Chat",
        messages: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
      });

      saveChats();
      messages.innerHTML = `
        <div class="welcome">
          <div class="welcome-icon">N</div>
          <h1>What can I help with?</h1>
          <p>Ask a question, write code, solve a problem, or start building something new.</p>
        </div>`;
      input.value = "";
      input.focus();
      renderHistory();
    }

    function renderAIMessage(content, text) {
      content.dataset.rawText = text;

      if (typeof marked !== "undefined") {
        content.innerHTML = marked.parse(text);
      } else {
        content.textContent = text;
      }

      if (typeof renderMathInElement !== "undefined") {
        renderMathInElement(content, {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    }

    function addMessage(text, type, save = true) {
      const message = document.createElement("div");
      message.className = type + "-message";

      const content = document.createElement("div");
      content.className = "message-content";
      content.dataset.rawText = text;

      if (type === "ai") {
        renderAIMessage(content, text);
      } else {
        content.textContent = text;
      }

      message.appendChild(content);
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      if (save) saveCurrentChat();
    }

    function saveCurrentChat() {
      const chat = getCurrentChat();
      if (!chat) return;

      chat.updatedAt = Date.now();
      chat.messages = [];

      messages.querySelectorAll(".user-message, .ai-message").forEach(element => {
        const content = element.querySelector(".message-content");
        if (!content) return;

        chat.messages.push({
          type: element.classList.contains("user-message") ? "user" : "ai",
          text: content.dataset.rawText || content.textContent
        });
      });

      saveChats();
      renderHistory();
    }

    function loadChat(chatId) {
      const chat = chats.find(item => item.id === chatId);
      if (!chat) return;

      currentChatId = chatId;
      messages.innerHTML = "";

      if (!chat.messages || chat.messages.length === 0) {
        messages.innerHTML = `
          <div class="welcome">
            <div class="welcome-icon">N</div>
            <h1>What can I help with?</h1>
            <p>Ask a question, write code, solve a problem, or start building something new.</p>
          </div>`;
      } else {
        chat.messages.forEach(item => addMessage(item.text, item.type, false));
      }

      input.value = "";
      input.focus();
      renderHistory();
    }

    function deleteChat(chatId) {
      if (!confirm("Delete this chat?")) return;

      chats = chats.filter(chat => chat.id !== chatId);
      saveChats();

      if (currentChatId === chatId) {
        currentChatId = null;
        messages.innerHTML = `
          <div class="welcome">
            <div class="welcome-icon">N</div>
            <h1>What can I help with?</h1>
            <p>Ask a question, write code, solve a problem, or start building something new.</p>
          </div>`;
      }

      renderHistory();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      if (!currentChatId) createNewChat();

      const chat = getCurrentChat();
      if (chat && chat.title === "New Chat") {
        chat.title = generateChatTitle(text);
        saveChats();
      }

      if (welcome) welcome.style.display = "none";
      addMessage(text, "user");
      input.value = "";

      const thinking = document.createElement("div");
      thinking.className = "ai-message";
      thinking.id = "thinking";
      thinking.innerHTML = `
        <div class="message-content">
          NMS AI is thinking<span class="dots">...</span>
        </div>`;
      messages.appendChild(thinking);
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch("http://127.0.0.1:5000/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Backend returned " + response.status);

        const data = await response.json();
        thinking.remove();
        addMessage(data.reply ?? "I didn't receive a reply from the backend.", "ai");
        saveCurrentChat();
      } catch (error) {
        thinking.remove();
        addMessage("⚠️ I couldn't connect to the NMS AI backend.", "ai");
        console.error(error);
      }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    });

    newChatButton.addEventListener("click", createNewChat);

    const historySearchToggle = document.querySelector(".history-search-toggle");
    const historySearchWrap = document.querySelector(".history-search-wrap");
    const historySearch = document.getElementById("historySearch");

    historySearchToggle.addEventListener("click", () => {
      historySearchWrap.classList.toggle("open");
      if (historySearchWrap.classList.contains("open")) {
        historySearch.focus();
      } else {
        historySearch.value = "";
        renderHistory();
      }
    });

    historySearch.addEventListener("input", renderHistory);

    function initializeChat() {
      if (chats.length) {
        loadChat(chats[0].id);
      } else {
        renderHistory();
      }
    }

    initializeChat();
  </script>
</body>
</html>
