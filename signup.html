<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NMS AI — Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <div class="logo">
            NMS <span>AI</span>
        </div>

        <h1>Create account</h1>

        <p class="subtitle">
            Join NMS AI and start chatting
        </p>

        <form id="signupForm">

            <label>Name</label>

            <input
                id="name"
                type="text"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                required
            >

            <label>Confirm Password</label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                required
            >

            <button type="submit">
                Create Account →
            </button>

            <p id="errorMessage" style="
                display:none;
                color:#ff6b6b;
                margin-top:12px;
                text-align:center;
            "></p>

        </form>

        <p class="signup">

            Already have an account?

            <a href="index.html">
                Sign in
            </a>

        </p>

    </div>




       <script>
function showAuthLoading(message) {
    const overlay = document.createElement("div");
    overlay.className = "auth-loader-overlay";
    overlay.innerHTML = `
        <div class="auth-spinner"></div>
        <div class="auth-loader-text">${message}</div>
    `;
    document.body.appendChild(overlay);
}

const signupForm = document.getElementById("signupForm");

signupForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const errorMessage = document.getElementById("errorMessage");

    if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match.";
        errorMessage.style.display = "block";
        return;
    }

    let accounts = JSON.parse(localStorage.getItem("nms_ai_accounts")) || [];
    const existingAccount = accounts.find(account => account.email === email);

    if (existingAccount) {
        errorMessage.textContent = "An account with this email already exists.";
        errorMessage.style.display = "block";
        return;
    }

    const newAccount = {
        id: "user_" + Date.now(),
        name: name,
        email: email,
        password: password
    };

    accounts.push(newAccount);
    localStorage.setItem("nms_ai_accounts", JSON.stringify(accounts));
    localStorage.setItem("nms_ai_logged_in_user", JSON.stringify({
        id: newAccount.id,
        name: newAccount.name,
        email: newAccount.email
    }));

    // Trigger smooth transition animation
    showAuthLoading("Creating account...");

    setTimeout(() => {
        window.location.href = "chat.html";
    }, 1200);
});
</script>
</body>

</html>
