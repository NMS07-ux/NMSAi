<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NMS AI — Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <div class="logo">
            NMS <span>AI</span>
        </div>

        <h1>Create account</h1>

        <p class="subtitle">
            Join NMS AI and start chatting
        </p>

        <form id="signupForm">

            <label>Name</label>

            <input
                id="name"
                type="text"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                required
            >

            <label>Confirm Password</label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                required
            >

            <button type="submit">
                Create Account →
            </button>

            <p id="errorMessage" style="
                display:none;
                color:#ff6b6b;
                margin-top:12px;
                text-align:center;
            "></p>

        </form>

        <p class="signup">

            Already have an account?

            <a href="index.html">
                Sign in
            </a>

        </p>

    </div>


    <script>
function showAuthLoading(message) {
    const overlay = document.createElement("div");
    overlay.className = "auth-loader-overlay";
    overlay.innerHTML = `
        <div class="auth-spinner"></div>
        <div class="auth-loader-text">${message}</div>
    `;
    document.body.appendChild(overlay);
}

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const loginError = document.getElementById("loginError");

    const accounts = JSON.parse(localStorage.getItem("nms_ai_accounts")) || [];
    const user = accounts.find(acc => acc.email === email && acc.password === password);

    if (user) {
        localStorage.setItem("nms_ai_logged_in_user", JSON.stringify({
            id: user.id,
            name: user.name,
            email: user.email
        }));
        
        // Trigger smooth transition animation
        showAuthLoading("Logging you in...");

        setTimeout(() => {
            window.location.href = "chat.html";
        }, 1200);
    } else {
        loginError.textContent = "Invalid email or password.";
        loginError.style.display = "block";
    }

        });

    </script>

</body>

</html>
