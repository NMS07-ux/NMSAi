<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NMS AI — Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <div class="logo">NMS <span>AI</span></div>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to continue to NMS AI
        </p>

       <!-- Replace the existing <form> in index.html with this labeled form -->
<form id="loginForm">
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="Enter your email" required>

    <label>Password</label>
    <div class="password-box">
        <input id="loginPassword" type="password" placeholder="Enter your password" required>
    </div>

    <div class="options">
        <label class="remember">
            <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Sign In →</button>
    <p id="loginError" style="display:none; color:#ff6b6b; margin-top:12px; text-align:center; font-size: 13px;"></p>
</form>

<div class="divider">
    <span></span> OR <span></span>
</div>

<button class="google">Continue with Google</button>

<p class="signup">
    Don't have an account? <a href="signup.html">Create account</a>
</p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const loginError = document.getElementById("loginError");

    const accounts = JSON.parse(localStorage.getItem("nms_ai_accounts")) || [];
    const user = accounts.find(acc => acc.email === email && acc.password === password);

    if (user) {
        // Save logged-in session key
        localStorage.setItem("nms_ai_logged_in_user", JSON.stringify({
            id: user.id,
            name: user.name,
            email: user.email
        }));
        window.location.href = "chat.html";
    } else {
        loginError.textContent = "Invalid email or password.";
        loginError.style.display = "block";
    }
});
</script>
</body>
</html>
